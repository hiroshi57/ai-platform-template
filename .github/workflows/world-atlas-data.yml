name: world-atlas data update

# せかい3Dデジタル図鑑のデータを毎週取り直し、差分があれば PR を作る。
# 取り込みは人がレビューして merge する(自動で main には書き込まない)。
# 前提: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests" を有効化。

on:
  schedule:
    - cron: "0 18 * * 0"   # 毎週月曜 03:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: world-atlas-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check pipeline (no network)
        run: |
          pip install "pytest>=8.0,<9.0"
          python -m pytest -q tests/test_world_atlas_pipeline.py

      - name: Build data (World Bank / UNDP / UNHCR / OWID / CIA Factbook / Wikipedia / Natural Earth)
        run: python -m world_atlas.pipeline.build_data

      - name: Summarize source status
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("world_atlas/site/data/meta.json", encoding="utf-8"))
          print(f"## world-atlas data {m['generated_at']}  ({m['ok']}/{m['total']} ok)")
          for k, v in m["sources"].items():
              if not v.get("ok"):
                  print(f"- ❌ `{k}`: {v.get('error', '')[:200]}")
          EOF

      - name: Open PR if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- world_atlas/site/data; then
            echo "no data changes"; exit 0
          fi
          BR="world-atlas/data-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add world_atlas/site/data
          git commit -m "chore: せかい3Dデジタル図鑑のデータを週次更新 ($(date -u +%Y-%m-%d))"
          git push -u origin "$BR"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BR" \
            --title "chore: せかい3Dデジタル図鑑 データ週次更新 $(date -u +%Y-%m-%d)" \
            --body "自動取得したデータの更新です。取得結果は Actions の Summary を確認してください。失敗したソースは前回データを保持しています。"
