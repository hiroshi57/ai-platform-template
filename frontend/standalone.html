<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI基盤（マルチAI使い分け・コスト見える化）</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;background:#f5f7f9;margin:0;padding:24px;color:#152238}
    .wrap{max-width:880px;margin:0 auto} h1{color:#4361ee;font-size:22px}
    h2{font-size:16px;margin:2px 0 8px} h3{font-size:14px;margin:10px 0 4px} .sub{color:#8a97a6;font-size:12px}
    .card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .explain{background:#eef2fd;border:1px solid #d8e0fb;border-radius:12px;padding:14px 16px}
    .explain dt{font-weight:bold;color:#2b3ea8;margin-top:8px} .explain dd{margin:2px 0 0;font-size:13px;line-height:1.7;color:#334}
    table{border-collapse:collapse;width:100%;font-size:13px} th,td{border:1px solid #e3e8ee;padding:8px;text-align:center} th{background:#eaeefb} td.l,th.l{text-align:left}
    .seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
    .seg button{border:1px solid #cdd6df;background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13px;text-align:left}
    .seg button.on{background:#4361ee;color:#fff;border-color:#4361ee}
    .answer{background:#eef7f0;border-radius:10px;padding:14px;margin-top:10px}
    .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .kpi{flex:1;min-width:120px;background:#f6f8ff;border-radius:10px;padding:10px;text-align:center}
    .kpi .v{font-size:20px;font-weight:bold;color:#4361ee} .kpi .l{font-size:11px;color:#667}
    input.num{width:90px;border:1px solid #cdd6df;border-radius:6px;padding:5px 8px;text-align:right}
    .note{color:#8a97a6;font-size:12px} .save{color:#17a673;font-weight:bold}
    @media(max-width:640px){body{padding:14px} .wrap{max-width:100%} h1{font-size:19px} table{display:block;overflow-x:auto;white-space:nowrap;font-size:12px}}
  </style>
</head>
<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:8px 14px;font:13px system-ui;color:#7a5b00">🔬 <b>デモ版</b>：数値は<b>サンプル（実測・実データではありません）</b>。ロジックの見せ方を確認するためのプロトタイプです。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
// 3つのAIの特性(1回あたりの目安・円/秒/品質) — 分かりやすく円と秒で表記
const AIS={
  claude:{label:"Claude (Anthropic)", yen:3.0, sec:0.9, q:3},
  gpt:{label:"GPT-4o (OpenAI)", yen:4.2, sec:1.1, q:3},
  gemini:{label:"Gemini (Google)", yen:1.0, sec:1.3, q:2},
};
const STRATS=[
  {id:"cost", name:"コスト優先", desc:"いちばん安いAIを選ぶ（大量処理・要約向き）", pick:"gemini"},
  {id:"latency", name:"速度優先", desc:"いちばん速いAIを選ぶ（チャット・リアルタイム向き）", pick:"claude"},
  {id:"quality", name:"品質優先", desc:"いちばん賢いAIを選ぶ（重要な判断・文章生成向き）", pick:"gpt"},
  {id:"balanced", name:"バランス", desc:"コスト・速度・品質の総合で選ぶ（ふだん使い）", pick:"claude"},
];
const ANSWER="経費精算の締め日は毎月20日です。20日を過ぎた申請は翌月扱いになります。（社内規程 第3条より）";
const stars=n=>"★★★☆☆".slice(3-n,6-n);

function App(){
  const [strat,setStrat]=React.useState("balanced");
  const [vol,setVol]=React.useState(10000);
  const s=STRATS.find(x=>x.id===strat), ai=AIS[s.pick];
  const monthly=Math.round(ai.yen*vol);
  const cheapest=Math.round(AIS.gemini.yen*vol), dearest=Math.round(AIS.gpt.yen*vol);

  return (<div className="wrap">
    <h1>AI基盤 <span className="sub">複数AI(Claude/GPT/Gemini)を賢く使い分け、コストと速度を見える化</span></h1>

    <div className="card explain">
      <h2 style={{color:"#2b3ea8"}}>このツールは何？（3行で）</h2>
      <dl>
        <dt>できること</dt><dd>Claude・GPT・Gemini など複数のAIを<b>1つの窓口で使い分け</b>ます。1社のAIに縛られません。</dd>
        <dt>分かること</dt><dd><b>どのAIが安い/速い/賢いか</b>、質問1回<b>いくらか</b>、月にすると<b>いくらか</b>を可視化します。</dd>
        <dt>取れるアクション</dt><dd>用途に合わせて選び方(戦略)を切替 → <b>コストを節約</b>／<b>予算オーバーを防止</b>できます。</dd>
      </dl>
    </div>

    <div className="card">
      <h2>使える3つのAIの比較</h2>
      <table><thead><tr><th className="l">AI</th><th>1回の目安料金</th><th>応答速度</th><th>品質</th></tr></thead>
        <tbody>{Object.values(AIS).map((a,i)=>(<tr key={i}><td className="l">{a.label}</td><td>{a.yen.toFixed(1)}円</td><td>{a.sec}秒</td><td>{stars(a.q)}</td></tr>))}</tbody></table>
      <p className="sub">※料金・速度は代表的な短い応答の目安（実際は文章の長さで変わります）。</p>
    </div>

    <div className="card">
      <h2>① 使ってみる（質問→自動で最適なAIが回答）</h2>
      <p className="sub">「選び方(戦略)」を選ぶと、その方針に合うAIが自動で選ばれます。何を優先するかで選ばれるAIと料金が変わります。</p>
      <div className="sub" style={{margin:"6px 0"}}>質問例: <b>「経費精算の締め日は？」</b></div>
      <div className="seg">{STRATS.map(x=>(<button key={x.id} className={x.id===strat?"on":""} onClick={()=>setStrat(x.id)}>
        <b>{x.name}</b><br/><span style={{fontSize:11,opacity:.85}}>{x.desc}</span></button>))}</div>
      <div className="answer">
        <div><b>AIの回答:</b> {ANSWER}</div>
        <div className="kpis">
          <div className="kpi"><div className="v">{ai.label.split(" ")[0]}</div><div className="l">選ばれたAI（{s.name}のため）</div></div>
          <div className="kpi"><div className="v">{ai.yen.toFixed(1)}円</div><div className="l">この回答の料金</div></div>
          <div className="kpi"><div className="v">{ai.sec}秒</div><div className="l">応答時間</div></div>
          <div className="kpi"><div className="v">{stars(ai.q)}</div><div className="l">品質</div></div>
        </div>
      </div>
    </div>

    <div className="card">
      <h2>② いくらかかる？（コストの見える化）</h2>
      <div style={{margin:"6px 0"}}>月に <input className="num" type="number" value={vol} onChange={e=>setVol(Number(e.target.value)||0)}/> 回 使うと…</div>
      <div className="kpis">
        <div className="kpi"><div className="v">{monthly.toLocaleString()}円</div><div className="l">今の戦略(「{s.name}」)の月額</div></div>
        <div className="kpi"><div className="v">{cheapest.toLocaleString()}円</div><div className="l">最安(コスト優先)の月額</div></div>
        <div className="kpi"><div className="v">{dearest.toLocaleString()}円</div><div className="l">最高品質の月額</div></div>
        <div className="kpi"><div className="v">{(dearest-cheapest).toLocaleString()}円</div><div className="l">選び方による差(節約余地)</div></div>
      </div>
      <p className="sub">👉 用途に応じて戦略を使い分けると、月<b>{(dearest-cheapest).toLocaleString()}円</b>ぶんの差をコントロールできます（＝FinOps）。予算を超えそうな時は自動で「コスト優先」に切替も可能。</p>
    </div>

    <div className="card">
      <h2>③ 使用状況の集計（観測性 ＝ 使った履歴の見える化）</h2>
      <p className="sub">「誰がどのAIを何回使い、合計いくらかかったか」を集計します。使いすぎ・偏りの発見に使います。</p>
      <div className="kpis">
        <div className="kpi"><div className="v">4回</div><div className="l">今週のリクエスト</div></div>
        <div className="kpi"><div className="v">約8円</div><div className="l">合計コスト</div></div>
        <div className="kpi"><div className="v">1.1秒</div><div className="l">平均応答時間</div></div>
        <div className="kpi"><div className="v">0回</div><div className="l">自動切替(障害時)</div></div>
      </div>
      <h3>AI別の内訳</h3>
      <table><thead><tr><th className="l">AI</th><th>使った回数</th><th>コスト</th></tr></thead>
        <tbody><tr><td className="l">Claude</td><td>2回</td><td>約6円</td></tr>
        <tr><td className="l">Gemini</td><td>2回</td><td>約2円</td></tr></tbody></table>
      <p className="sub">この例では Claude を2回・Gemini を2回使用。障害時の自動切替(フォールバック)は0回＝安定稼働。</p>
    </div>
    <p className="note">※数値は分かりやすさ優先のサンプルです。実運用では各AIの実料金・実測速度に置き換わります。</p>
  </div>);
}
</script>
<script>(function(){var src=document.getElementById("__jsx").textContent;var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;(0,eval)(out);ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));})();</script>
</body></html>
