# Cloud Run 相当のデプロイ manifest(サンプル). 新規アプリは image 名を差し替えるだけ。
#
# 既知の制約(正直表記):
#   - レート制限とインメモリ観測性は **プロセスローカル**。maxScale=10 で動かすと
#     実効レート上限は設定値の最大10倍になり、/v1/metrics はインスタンスごとに
#     異なる値を返す。厳密な制御が要るなら Redis 等の共有ストアへ差し替えること。
#   - SQLite はコンテナローカル。Cloud Run はインスタンスが揮発するため、
#     コスト履歴を保持するには Cloud SQL 等の外部DBか GCS FUSE マウントが必要。
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-platform-app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 40
      timeoutSeconds: 120
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/ai-platform/app:latest
          ports:
            - containerPort: 8000
          env:
            - name: AI_PLATFORM_STRATEGY
              value: "balanced"
            - name: AI_PLATFORM_LOG_JSON
              value: "true"
            - name: AI_PLATFORM_DB_PATH
              value: "/data/ai_platform.db"
            # 予算ガード(0 で無効)。着地見込み超過時に cost 戦略へ自動降格。
            - name: AI_PLATFORM_MONTHLY_BUDGET_USD
              value: "0"
            # CORS 許可オリジン(フロントを別ドメインで配信する場合に設定)
            - name: AI_PLATFORM_CORS_ORIGINS
              value: "https://your-frontend.example.com"
            # 認証キーは必須。未設定だと全リクエストが 401 になる。
            - name: AI_PLATFORM_API_KEYS
              valueFrom: { secretKeyRef: { name: ai-platform-api-keys, key: latest } }
            # APIキーはSecret Managerから注入(未設定ならmockで起動)
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: anthropic-api-key, key: latest } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: openai-api-key, key: latest } }
            # 旧 manifest は gemini を既定で有効にしながら GOOGLE_API_KEY を
            # 注入しておらず、gemini だけ常に mock で動く不整合があった。
            - name: GOOGLE_API_KEY
              valueFrom: { secretKeyRef: { name: google-api-key, key: latest } }
          resources:
            limits: { cpu: "1", memory: "512Mi" }
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 30
